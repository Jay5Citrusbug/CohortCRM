name: Playwright Tests

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # 
  push:
    branches: ['main']

jobs:
  Staging-Tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          echo "Cleaning previous Playwright report..."
          rm -rf playwright-report report.html all-reports || true

      - name: Run Playwright tests 
        id: run-tests
        continue-on-error: true
        run: npx playwright test --project=chromium --workers=1

      - name: Generate standalone HTML report
        run: cp playwright-report/index.html playwright-report/report.html || true

      - name: Extract test summary
        id: summary
        continue-on-error: true
        run: |
          if [ ! -f "playwright-report/report.json" ]; then
            echo "Report file not found!"
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          PASSED=$(jq '.stats.expected // 0' playwright-report/report.json)
          FAILED=$(jq '.stats.unexpected // 0' playwright-report/report.json)
          SKIPPED=$(jq '.stats.skipped // 0' playwright-report/report.json)
          TOTAL=$(( PASSED + FAILED + SKIPPED ))
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Get current date with random suffix
        id: date
        run: echo "date=$(date '+%Y-%m-%d')-$(shuf -i 100-999 -n 1)" >> $GITHUB_OUTPUT

      - name: Prepare report folder
        run: |
          mkdir -p reports/${{ steps.date.outputs.date }}
          cp -r playwright-report/* reports/${{ steps.date.outputs.date }}/
          touch reports/.nojekyll

      - name: Upload report as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports



    outputs:
      date: ${{ steps.date.outputs.date }}
      total: ${{ steps.summary.outputs.total }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}

  deploy:
    needs: Staging-Tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages (deploys the artifact uploaded earlier)
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Debug deployed page_url
        run: |
          echo "deploy step outputs:"
          echo "page_url = ${{ steps.deploy.outputs.page_url }}"
        # always run this (no 'if') so we have logs to inspect

      # Checkout repo before running sendreport.js so script exists
      - name: Checkout repository (for sendreport.js)
        uses: actions/checkout@v4

      - name: Setup Node.js (for sendreport.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nodemailer (only what we need for sendreport.js)
        run: npm install nodemailer

      # ✅ Now that the pages are deployed, send the email
      - name: Send Email Report via SMTP
        if: always()
        run: node .github/workflows/sendreport.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_DATE: ${{ needs.Staging-Tests.outputs.date }}
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
      
      # ✅ Discord notification
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"Playwright Bot\",
            \"embeds\": [{
              \"title\": \"🎭 Cohort CRM - Playwright Test Results\",
              \"description\": \"**Total:** ${TOTAL}\\n✅ Passed: ${PASSED}\\n❌ Failed: ${FAILED}\\n⚪ Skipped: ${SKIPPED}\",
              \"color\": $(if [ ${FAILED} -gt 0 ]; then echo 15158332; else echo 3066993; fi),
              \"fields\": [{
                \"name\": \"📎 View Report\",
                \"value\": \"${REPORT_URL}\"
              }],
              \"footer\": { \"text\": \"GitHub Action - ${GITHUB_WORKFLOW}\" }
            }]
          }" \
          $DISCORD_WEBHOOK_URL
