name: Playwright Tests

permissions:
  contents: write   # ⚠️ needed to push to gh-pages
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  schedule:
    #- cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  Staging-Tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    outputs:
      date: ${{ steps.date.outputs.date }}
      total: ${{ steps.summary.outputs.total }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          rm -rf playwright-report report.html all-reports || true

      - name: Run Playwright tests
        id: run-tests
        continue-on-error: true
        run: npx playwright test --workers=1

      - name: Generate standalone HTML report
        run: cp playwright-report/index.html playwright-report/report.html || true

      - name: Extract test summary
        id: summary
        continue-on-error: true
        run: |
          if [ ! -f "playwright-report/report.json" ]; then
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          PASSED=$(jq '.stats.expected // 0' playwright-report/report.json)
          FAILED=$(jq '.stats.unexpected // 0' playwright-report/report.json)
          SKIPPED=$(jq '.stats.skipped // 0' playwright-report/report.json)
          TOTAL=$(( PASSED + FAILED + SKIPPED ))
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date '+%Y-%m-%d')-$(shuf -i 100-999 -n 1)" >> $GITHUB_OUTPUT

      # ✅ Prepare new report folder
      - name: Prepare report folder
        run: |
          mkdir -p current-report/${{ steps.date.outputs.date }}
          cp -r playwright-report/* current-report/${{ steps.date.outputs.date }}/ || true

      # ✅ Deploy to GitHub Pages (preserves history with clean: false)
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: current-report
          target-folder: reports
          clean: false

  Notifications:
    needs: Staging-Tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nodemailer
        run: npm install nodemailer

      # ✅ Send Email
      - name: Send Email Report
        if: always()
        run: node .github/workflows/sendreport.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_DATE: ${{ needs.Staging-Tests.outputs.date }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}

      # ✅ Discord Notification
      - name: Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}
          STAGING_TESTS_STATUS: ${{ needs.Staging-Tests.result }}
        run: node .github/workflows/notify_discord.js
