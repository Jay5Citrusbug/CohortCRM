          git config user.email "actions@github.com"
          git add .
          git commit -m "Update report ${{ steps.date.outputs.date }}" || echo "No changes"
          git push origin gh-pages

  Notifications:
    needs: Staging-Tests
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages 
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Debug deployed page_url
        run: |
          echo "deploy step outputs:"
          echo "page_url = ${{ steps.deploy.outputs.page_url }}"
        # always run this (no 'if') so we have logs to inspect

      # Checkout repo before running sendreport.js so script exists
      - name: Checkout repository (for sendreport.js)
        uses: actions/checkout@v4

      - name: Setup Node.js (for sendreport.js and notifications)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nodemailer
        run: npm install nodemailer

      # ✅ Send Email
      - name: Send Email Report
        if: always()
        run: node .github/workflows/sendreport.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_DATE: ${{ needs.Staging-Tests.outputs.date }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}

      # ✅ Discord Success
      - name: Discord Success
        if: always() && needs.Staging-Tests.outputs.failed == 0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"Playwright Bot\",
            \"embeds\": [{
              \"title\": \"🎭 Playwright Test Results\",
              \"description\": \"**Total:** ${TOTAL}\\n✅ Passed: ${PASSED}\\n❌ Failed: ${FAILED}\\n⚪ Skipped: ${SKIPPED}\",
              \"color\": 3066993,
              \"fields\": [{
                \"name\": \"📎 View Report\",
                \"value\": \"${REPORT_URL}\"
              }]
            }]
          }" \
          $DISCORD_WEBHOOK_URL

      # ✅ Discord Failure
      - name: Discord Failure
        if: always() && needs.Staging-Tests.outputs.failed > 0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ needs.Staging-Tests.outputs.date }}/report.html
          TOTAL: ${{ needs.Staging-Tests.outputs.total }}
          PASSED: ${{ needs.Staging-Tests.outputs.passed }}
          FAILED: ${{ needs.Staging-Tests.outputs.failed }}
          SKIPPED: ${{ needs.Staging-Tests.outputs.skipped }}
          REPORT_DATE: ${{ needs.Staging-Tests.outputs.date }}
        run: node .github/workflows/notify_discord.js
