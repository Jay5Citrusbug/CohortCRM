name: Playwright Tests

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]

jobs:
  Staging-Tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous reports
        run: rm -rf playwright-report/ all-reports/ || true

      - name: Run Playwright tests
        id: run-tests
        continue-on-error: true
        run: npx playwright test --workers=1

      - name: Generate HTML report
        run: |
          npx playwright show-report --reporter=html
          cp playwright-report/index.html playwright-report/report.html

      - name: Get current date with random suffix
        id: date
        run: echo "date=$(date '+%Y-%m-%d')-$(shuf -i 100-999 -n 1)" >> $GITHUB_OUTPUT

      - name: Prepare report folder
        run: |
          mkdir -p all-reports/${{ steps.date.outputs.date }}
          cp -r playwright-report/* all-reports/${{ steps.date.outputs.date }}/
          touch all-reports/${{ steps.date.outputs.date }}/.nojekyll

      - name: Verify report files
        run: ls -R all-reports/${{ steps.date.outputs.date }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./all-reports

      - name: Send Email Report via SMTP
        if: always()
        run: node .github/workflows/sendreport.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_DATE: ${{ steps.date.outputs.date }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/all-reports/${{ steps.date.outputs.date }}/report.html
