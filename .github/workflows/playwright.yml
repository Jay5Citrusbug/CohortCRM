      # ✅ Keep only last 30 reports
      - name: Cleanup old reports
        run: |
          cd reports
          ls -1dt */ | tail -n +31 | xargs rm -rf || true

      # ✅ Ensure GitHub Pages works
      - name: Add .nojekyll
        run: touch reports/.nojekyll

      # ✅ Commit & push
      - name: Push reports to gh-pages
        run: |
