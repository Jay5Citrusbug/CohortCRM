name: Playwright Tests - Unified (Test → Deploy → Email)

# Run on pushes to main or on-demand
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    name: Run Playwright tests & prepare report
    runs-on: ubuntu-latest
    # always produce outputs even if tests fail
    continue-on-error: true

    outputs:
      date: ${{ steps.date.outputs.date }}
      total: ${{ steps.summary.outputs.total }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (repo)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          echo "Cleaning previous Playwright report..."
          rm -rf playwright-report report.html reports || true

      - name: Run Playwright tests (HTML + JSON reporters)
        id: playwright-run
        run: |
          # generate both HTML and JSON report
          npx playwright test --workers=1 --reporter=dot,html --reporter=json
        continue-on-error: true

      - name: Generate standalone HTML report (copy index -> report.html)
        run: |
          if [ -f "playwright-report/index.html" ]; then
            cp playwright-report/index.html playwright-report/report.html || true
          fi

      - name: Extract test summary
        id: summary
        continue-on-error: true
        run: |
          # If Playwright didn't produce a report.json, set zeros
          if [ ! -f "playwright-report/report.json" ]; then
            echo "Report file not found!"
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          PASSED=$(jq '.stats.expected // 0' playwright-report/report.json)
          FAILED=$(jq '.stats.unexpected // 0' playwright-report/report.json)
          SKIPPED=$(jq '.stats.skipped // 0' playwright-report/report.json)
          TOTAL=$(( PASSED + FAILED + SKIPPED ))
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Get current date with random suffix
        id: date
        run: |
          # example: 2025-11-06-648
          echo "date=$(date '+%Y-%m-%d')-$(shuf -i 100-999 -n 1)" >> $GITHUB_OUTPUT

      - name: Prepare reports folder (flattened structure)
        run: |
          mkdir -p reports/${{ steps.date.outputs.date }}
          cp -r playwright-report/* reports/${{ steps.date.outputs.date }}/ || true
          # Prevent Pages ignoring folders starting with "_"
          touch reports/.nojekyll

      - name: Show report tree (for debug)
        run: |
          echo "Reports created at: reports/${{ steps.date.outputs.date }}"
          ls -la reports || true
          ls -la reports/${{ steps.date.outputs.date }} || true

      - name: Upload Pages artifact (reports/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy-and-email:
    name: Deploy Pages and send email
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages (deploys the artifact uploaded earlier)
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Debug deployed page_url
        run: |
          echo "deploy step outputs:"
          echo "page_url = ${{ steps.deploy.outputs.page_url }}"
        # always run this (no 'if') so we have logs to inspect

      # Checkout repo before running sendreport.js so script exists
      - name: Checkout repository (for sendreport.js)
        uses: actions/checkout@v4

      - name: Setup Node.js (for sendreport.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nodemailer (only what we need for sendreport.js)
        run: npm install nodemailer

      - name: Debug full report URL (sanity)
        run: |
          BASE_URL="${{ steps.deploy.outputs.page_url }}"
          # ensure no double-slash
          if [[ "${BASE_URL: -1}" != "/" ]]; then BASE_URL="${BASE_URL}/"; fi
          FULL_URL="${BASE_URL}${{ needs.run-tests.outputs.date }}/report.html"
          echo "✔ Final Report URL to be sent in email: $FULL_URL"

      - name: Send Email Report via SMTP
        if: always()
        run: node .github/workflows/sendreport.js
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # use date from the previous job
          REPORT_DATE: ${{ needs.run-tests.outputs.date }}
          # the Pages base URL returned by deploy step typically ends with "/"
          REPORT_URL: ${{ steps.deploy.outputs.page_url }}${{ needs.run-tests.outputs.date }}/report.html
          TOTAL: ${{ needs.run-tests.outputs.total }}
          PASSED: ${{ needs.run-tests.outputs.passed }}
          FAILED: ${{ needs.run-tests.outputs.failed }}
          SKIPPED: ${{ needs.run-tests.outputs.skipped }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
